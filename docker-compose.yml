services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-platform-pg
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas_platform
    ports:
      - "5433:5432"
    volumes:
      - saas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: saas-platform-redis
    ports:
      - "6380:6379"
    volumes:
      - saas_redis_data:/data

volumes:
  saas_pg_data:
  saas_redis_data:
